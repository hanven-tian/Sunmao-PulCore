services:
  api:
    image: ghcr.io/hanven-tian/sunmao-pulcore-api:${PULCORE_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "${PULCORE_API_PORT:-3001}:3000"
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
  console:
    image: ghcr.io/hanven-tian/sunmao-pulcore-console:${PULCORE_VERSION:-latest}
    build:
      context: ./web
      dockerfile: Dockerfile
    init: true
    ports:
      - "${PULCORE_CONSOLE_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 3
